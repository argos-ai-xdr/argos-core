[project]
name = "argos-core"
version = "0.1.0-dev"
description = "Servicios funcionales del AI-assisted XDR (argos-ai-xdr)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "jsonschema>=4.18",
  "referencing>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Cada subcarpeta de libs/, services/ y connectors/ con __init__.py se
# empaqueta como paquete de nivel superior (import argos_envelope, import
# normalizer, import netbox, ...) — no como libs.argos_envelope. Ver
# README.md "Nota de nombres de paquete".
[tool.setuptools.packages.find]
where = ["libs", "services", "connectors"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
