apiVersion: apps/v1
kind: Deployment
metadata:
  name: normalizer
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: normalizer
  template:
    metadata:
      labels:
        app: normalizer
    spec:
      serviceAccountName: normalizer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: normalizer
          image: "{{ required "image.repository es obligatorio (ver values.yaml TODO, ADR-013)" .Values.image.repository }}@{{ required "image.digest es obligatorio, nunca desplegar por tag (ADR-013)" .Values.image.digest }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
